<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rohit Yadav — AI Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c26;
      --border: rgba(255,255,255,0.07);
      --purple: #7F77DD; --purple-light: #AFA9EC;
      --purple-dim: rgba(127,119,221,0.12); --purple-dim2: rgba(127,119,221,0.2);
      --text: #e2e0f0; --text-muted: #7a7890; --text-faint: #4a4860;
      --user-bg: #4a42a8; --user-text: #eeedfe;
      --green: #3ecf6e; --radius: 14px;
    }
    html, body { height: 100%; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    header { display:flex; align-items:center; gap:12px; padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
    .hdr-avatar { width:42px; height:42px; border-radius:50%; border:2px solid var(--purple); overflow:hidden; flex-shrink:0; }
    .hdr-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .header-info h1 { font-size:15px; font-weight:600; color:var(--text); }
    .header-info p  { font-size:12px; color:var(--text-muted); }
    .online-badge { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--green); }
    .online-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 5px var(--green); animation:glow 2s ease-in-out infinite; }
    @keyframes glow { 0%,100%{opacity:1} 50%{opacity:.3} }
    #messages { flex:1; overflow-y:auto; padding:24px 16px 12px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
    #messages::-webkit-scrollbar { width:3px; }
    #messages::-webkit-scrollbar-thumb { background:var(--surface2); border-radius:3px; }
    .welcome-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:28px 24px; text-align:center; max-width:600px; margin:0 auto; width:100%; }
    .welcome-avatar { width:80px; height:80px; border-radius:50%; border:2.5px solid var(--purple); overflow:hidden; margin:0 auto 16px; }
    .welcome-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .welcome-card h2 { font-size:22px; font-weight:700; background:linear-gradient(120deg,var(--purple-light) 0%,#fff 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px; }
    .welcome-card p { font-size:14px; color:var(--text-muted); line-height:1.65; margin-bottom:22px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .chip { background:var(--surface2); border:1px solid var(--border); color:var(--text-muted); padding:7px 14px; border-radius:20px; font-size:13px; cursor:pointer; transition:border-color .2s,color .2s,background .2s; }
    .chip:hover { border-color:var(--purple); color:var(--purple-light); background:var(--purple-dim); }
    .row { display:flex; flex-direction:column; max-width:720px; margin:0 auto; width:100%; }
    .row.user { align-items:flex-end; }
    .row.ai   { align-items:flex-start; }
    .row-label { font-size:11px; color:var(--text-faint); margin-bottom:5px; padding:0 4px; display:flex; align-items:center; gap:6px; }
    .lbl-pic { width:18px; height:18px; border-radius:50%; overflow:hidden; border:1px solid var(--purple); flex-shrink:0; }
    .lbl-pic img { width:100%; height:100%; object-fit:cover; display:block; }
    .bubble { padding:11px 15px; border-radius:var(--radius); font-size:14px; line-height:1.75; max-width:min(78%,560px); word-break:break-word; white-space:pre-wrap; }
    .row.user .bubble { background:var(--user-bg); color:var(--user-text); border-bottom-right-radius:3px; }
    .row.ai   .bubble { background:var(--surface); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:3px; }
    .thinking-bubble { display:flex; align-items:center; gap:5px; padding:13px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); border-bottom-left-radius:3px; }
    .dot-anim { width:7px; height:7px; border-radius:50%; background:var(--purple); animation:bounce 1.1s infinite ease-in-out; }
    .dot-anim:nth-child(2){animation-delay:.18s} .dot-anim:nth-child(3){animation-delay:.36s}
    @keyframes bounce { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1);opacity:1} }
    .error-bubble { background:rgba(220,50,50,.1); border:1px solid rgba(220,50,50,.3); color:#f09595; padding:10px 14px; border-radius:var(--radius); font-size:13px; max-width:min(78%,560px); }
    footer { flex-shrink:0; padding:12px 16px 16px; background:var(--surface); border-top:1px solid var(--border); }
    .input-box { max-width:720px; margin:0 auto; display:flex; align-items:flex-end; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:8px 10px 8px 14px; transition:border-color .2s; }
    .input-box:focus-within { border-color:var(--purple); }
    #user-input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:14px; font-family:inherit; line-height:1.6; resize:none; min-height:24px; max-height:130px; overflow-y:auto; padding:2px 0; }
    #user-input::placeholder { color:var(--text-faint); }
    #send-btn { width:36px; height:36px; flex-shrink:0; background:var(--purple); border:none; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity .15s,transform .1s; }
    #send-btn:hover:not(:disabled){opacity:.82} #send-btn:active:not(:disabled){transform:scale(.93)} #send-btn:disabled{opacity:.3;cursor:not-allowed}
    .hint { text-align:center; font-size:11px; color:var(--text-faint); margin-top:8px; }
    @media(max-width:500px){ .bubble{max-width:90%} .welcome-card{padding:20px 16px} }
  </style>
</head>

    })
    .then(function(res) {
      if (!res.ok) return res.json().then(function(e){ throw new Error(e.error&&e.error.message?e.error.message:"Server error "+res.status); });
      return res.json();
    })
    .then(function(data) {
      var reply = (data.content||[]).map(function(b){return b.text||"";}).join("").trim();
      if (!reply) throw new Error("Khaali response mila.");
      history.push({ role: "assistant", content: reply });
      setReply(thinkRow, reply);
    })
    .catch(function(err) {
      history.pop();
      setError(thinkRow, "⚠️ "+(err.message||"Kuch gadbad ho gayi.")+" — Internet check karein ya page refresh karein.");
    })
    .finally(function() { btnEl.disabled = false; inputEl.focus(); });
  }
</script>
</body>
</html>
