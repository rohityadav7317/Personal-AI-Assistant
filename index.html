<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Rohit Yadav — AI Assistant</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;
  --border:rgba(255,255,255,0.07);
  --purple:#7F77DD;--purple-light:#AFA9EC;
  --purple-dim:rgba(127,119,221,0.12);
  --text:#e2e0f0;--text-muted:#7a7890;--text-faint:#4a4860;
  --user-bg:#4a42a8;--user-text:#eeedfe;
  --green:#3ecf6e;--radius:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.hdr-avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--purple);overflow:hidden;flex-shrink:0}
.hdr-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.header-info h1{font-size:15px;font-weight:600;color:var(--text)}
.header-info p{font-size:12px;color:var(--text-muted)}
.online-badge{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green)}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.3}}
#messages{flex:1;overflow-y:auto;padding:24px 16px 12px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
.welcome-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;text-align:center;max-width:600px;margin:0 auto;width:100%}
.welcome-avatar{width:80px;height:80px;border-radius:50%;border:2.5px solid var(--purple);overflow:hidden;margin:0 auto 16px}
.welcome-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.welcome-card h2{font-size:22px;font-weight:700;background:linear-gradient(120deg,var(--purple-light) 0%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.welcome-card p{font-size:14px;color:var(--text-muted);line-height:1.65;margin-bottom:22px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.chip:hover{border-color:var(--purple);color:var(--purple-light);background:var(--purple-dim)}
.row{display:flex;flex-direction:column;max-width:720px;margin:0 auto;width:100%}
.row.user{align-items:flex-end}
.row.ai{align-items:flex-start}
.row-label{font-size:11px;color:var(--text-faint);margin-bottom:5px;padding:0 4px;display:flex;align-items:center;gap:6px}
.lbl-pic{width:18px;height:18px;border-radius:50%;overflow:hidden;border:1px solid var(--purple);flex-shrink:0}
.lbl-pic img{width:100%;height:100%;object-fit:cover;display:block}
.bubble{padding:11px 15px;border-radius:var(--radius);font-size:14px;line-height:1.75;max-width:min(78%,560px);word-break:break-word;white-space:pre-wrap}
.row.user .bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:3px}
.row.ai .bubble{background:var(--surface);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:3px}
.typing-bubble{display:flex;align-items:center;gap:5px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:3px}
.dot-anim{width:7px;height:7px;border-radius:50%;background:var(--purple);animation:bounce 1.1s infinite ease-in-out}
.dot-anim:nth-child(2){animation-delay:.18s}.dot-anim:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
footer{flex-shrink:0;padding:12px 16px 16px;background:var(--surface);border-top:1px solid var(--border)}
.input-box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px 8px 14px;transition:border-color .2s}
.input-box:focus-within{border-color:var(--purple)}
#user-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;line-height:1.6;resize:none;min-height:24px;max-height:130px;overflow-y:auto;padding:2px 0}
#user-input::placeholder{color:var(--text-faint)}
#send-btn{width:36px;height:36px;flex-shrink:0;background:var(--purple);border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s}
#send-btn:hover:not(:disabled){opacity:.82}#send-btn:active:not(:disabled){transform:scale(.93)}#send-btn:disabled{opacity:.3;cursor:not-allowed}
.hint{text-align:center;font-size:11px;color:var(--text-faint);margin-top:8px}
@media(max-width:500px){.bubble{max-width:90%}.welcome-card{padding:20px 16px}}
</style>
</head>
<body>

<script>
// Aapki original base64 photo yahan store hai
var PHOTO = "PHOTO_PLACEHOLDER";
</script>

<header>
  <div class="hdr-avatar">
    <img id="hdr-img" alt="Rohit Yadav"/>
  </div>
  <div class="header-info">
    <h1>Rohit Yadav</h1>
    <p>Personal AI Assistant</p>
  </div>
  <div class="online-badge">
    <div class="online-dot"></div>Online
  </div>
</header>

<div id="messages">
  <div class="welcome-card">
    <div class="welcome-avatar">
      <img id="welcome-img" alt="Rohit Yadav"/>
    </div>
    <h2>Rohit ka AI Assistant</h2>
    <p>Namaste! Main Rohit Yadav ka personal AI assistant hoon.<br>Koi bhi sawaal poochein — coding, science, history, ya kuch bhi!</p>
    <div class="suggestions">
      <button class="chip" onclick="quickAsk('Python mein for loop ka example batao')">Python loop 🐍</button>
      <button class="chip" onclick="quickAsk('India ka itihaas short mein batao')">India ka itihaas 🇮🇳</button>
      <button class="chip" onclick="quickAsk('Ek acchi motivational quote batao')">Motivation 💪</button>
      <button class="chip" onclick="quickAsk('AI aur Machine Learning mein kya fark hai?')">AI vs ML 🧠</button>
      <button class="chip" onclick="quickAsk('Ek funny joke sunao')">Joke 😄</button>
    </div>
  </div>
</div>

<footer>
  <div class="input-box">
    <textarea id="user-input" placeholder="Koi bhi sawaal poochein..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMsg()" title="Bhejo" aria-label="Bhejo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <p class="hint">Enter = Bhejo &nbsp;•&nbsp; Shift+Enter = New line</p>
</footer>

<script>
// Photo set karo
document.getElementById('hdr-img').src = PHOTO;
document.getElementById('welcome-img').src = PHOTO;

var msgsEl = document.getElementById("messages");
var inputEl = document.getElementById("user-input");
var btnEl = document.getElementById("send-btn");

var responses = {
  python: [
    "Python mein for loop ka example:\n\nfor i in range(5):\n    print(i)\n\nYeh 0 se 4 tak print karega!\n\nList pe loop:\nfruits = ['apple', 'banana', 'mango']\nfor fruit in fruits:\n    print(fruit)\n\nKya aur kuch Python ke baare mein jaanna chahte ho? 🐍",
    "Python loop aur bhi tareekon se:\n\n# While loop\nx = 0\nwhile x < 5:\n    print(x)\n    x += 1\n\n# List comprehension\nsquares = [i**2 for i in range(10)]\nprint(squares)\n# Output: [0,1,4,9,16,25,36,49,64,81]\n\nBahut powerful hai Python! 😊"
  ],
  india: [
    "India ka itihaas bahut rich hai! 🇮🇳\n\n🏛️ Sindhu Ghati Sabhyata (3000 BC) — purani civilization\n📜 Maurya Samrajya — Chandragupta aur Ashoka\n🕌 Mughal Kaal (1526-1857) — Akbar, Shah Jahan, Taj Mahal\n🇬🇧 British Raj (1857-1947)\n🕊️ Azadi (15 August 1947) — Gandhi ji, Nehru\n🗳️ Aaj duniya ka sabse bada loktantra!\n\nKisi period ke baare mein detail mein bataaon? 📖"
  ],
  motivation: [
    "\"Sapne woh nahi jo neend mein aate hain,\nSapne woh hain jo neend nahi aane dete.\"\n— APJ Abdul Kalam 🌟\n\nHar bada aadmi ek waqt chota tha. Mehnat karo, results zaroor aayenge! 💪",
    "\"Koshish karne waalon ki kabhi haar nahi hoti.\"\n\nJindagi mein mushkilein aayengi, par yahi mushkilein tumhe strong banati hain. Ek kadam aage badho! 🚀",
    "\"Safalta ka koi shortcut nahi — sirf mehnat, dhairya aur lagan.\"\n\nAaj jo beej booge, kal ka ped banega. Keep going! 🌱✨"
  ],
  aiml: [
    "AI vs Machine Learning — asaan explanation! 🧠\n\n🤖 AI (Artificial Intelligence):\nMachines ko insaan jaisi soochne ki taakat dena.\nChess khelna, language samajhna — sab AI hai.\n\n📊 Machine Learning (ML):\nAI ka ek PART — machines data se seekhti hain\nbina explicitly program kiye.\n\nRelation:\nAI ⊃ ML ⊃ Deep Learning\n\nExample:\n• AI = ghar banana\n• ML = sikhne ka ek tarika\n• Deep Learning = advanced architecture\n\nKoi specific topic explore karna hai? 🚀"
  ],
  joke: [
    "Programmer apni girlfriend se:\nGF: 'Bazaar se 1 litre doodh le aa. Anday mile toh 12 le aana.'\n\nProgrammer 12 litre doodh le aaya! 😂\n\n'Anday mile the!' ✅🥚",
    "Teacher: '1+1 kitna hota hai?'\nStudent: 'Depend karta hai Sir!'\nTeacher: 'Kaise??'\nStudent: 'Agar dono pyaar mein hain toh 1, warna 2!' 😂❤️",
    "Engineer apni maa ko:\n'Maa, main kuch bhi kar sakta hoon technology mein!'\nMaa: 'Beta, toh TV remote kyun kaam nahi karta?'\nEngineer: '...yeh hardware problem hai maa!' 😅"
  ],
  html: [
    "HTML se web pages bante hain! 🌐\n\nBasic structure:\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Mera Page</title>\n</head>\n<body>\n  <h1>Namaste Duniya!</h1>\n  <p>Pehla web page!</p>\n</body>\n</html>\n\nImportant tags:\n• h1-h6 — headings\n• p — paragraph\n• a href — links\n• img src — images\n• div — container\n\nCSS bhi sikhna hai? 🎨"
  ],
  css: [
    "CSS se website sundar banti hai! 🎨\n\nbody {\n  background: #f0f0f0;\n  font-family: Arial;\n}\n\nh1 {\n  color: purple;\n  text-align: center;\n}\n\n.button {\n  background: blue;\n  color: white;\n  padding: 10px 20px;\n  border-radius: 8px;\n}\n\nMain properties:\n• color — text color\n• background — background\n• font-size — size\n• margin/padding — spacing\n• display: flex — layout\n\nKoi specific design? 🎨"
  ],
  javascript: [
    "JavaScript se pages interactive bante hain! ⚡\n\nlet name = 'Rohit';\nconst age = 25;\n\nfunction greet(name) {\n  return 'Namaste, ' + name;\n}\n\n// Button click\ndocument.getElementById('btn')\n  .addEventListener('click', () => {\n    alert('Click!');\n  });\n\n// Array\nlet nums = [1,2,3,4,5];\nlet doubled = nums.map(n => n*2);\n// [2,4,6,8,10]\n\nReact ya Node.js seekhna hai? 🚀"
  ],
  coding: [
    "Coding seekhne ke tips! 💻\n\n1️⃣ Roz 30-60 min practice karo\n2️⃣ Ek language se shuru karo (Python best hai)\n3️⃣ Projects banao — theory se zyada seekhte ho\n4️⃣ Stack Overflow aur GitHub use karo\n5️⃣ Errors se daro mat — wahi teacher hai!\n\nKaun si language seekhna chahte ho? 🎯"
  ],
  space: [
    "Space bahut fascinating hai! 🚀🌌\n\n🌍 Earth: 12,742 km diameter, hamaara ghar\n🌙 Moon: 384,400 km door, 1969 mein human pahunche\n☀️ Sun: 149.6 million km door, 109x Earth se bada\n♂️ Mars: agla destination for humans\n🌌 Milky Way: 100 billion stars!\n🔭 Universe: 93 billion light years wide!\n\nBlack holes ya alien life ke baare mein bataaon? 🛸"
  ],
  health: [
    "Health tips! 💪\n\n🍎 Khaana:\n• Balanced diet — vegetables, protein, carbs\n• Junk food kam karo\n• 8 glass paani roz piyo\n\n🏃 Exercise:\n• 30 min roz walk\n• Yoga bahut faydemand hai\n• 7-8 ghante neend lo\n\n🧠 Mental Health:\n• Stress manage karo\n• Meditation try karo\n• Dosto se baat karo\n\nKoi specific concern? 🏥"
  ],
  science: [
    "Science ke baare mein bataaon! 🔬\n\n🧪 Chemistry — atoms, molecules, reactions\n🔭 Physics — forces, energy, relativity\n🧬 Biology — cells, DNA, evolution\n🌍 Earth Science — geology, climate\n🚀 Space — planets, stars, black holes\n\nKoi specific topic batao! ⚡"
  ],
  default: [
    "Bahut achha sawaal! 😊\n\nYeh ek interesting topic hai. Agar aur detail mein jaanna chahte ho toh specific question poochein — main poori help karunga!\n\nAur kya jaanna chahte ho? 🤔",
    "Samajh gaya! Dekhte hain...\n\nIs topic ke kaafi aspects hain. Kya thoda specific kar sakte ho?\n• Kaunsa aspect?\n• Example chahiye?\n• Basic ya advanced?\n\nMain clear jawab dunga! 💡",
    "Great question! 🌟\n\nYeh ek important topic hai. Main step-by-step samjhaata hoon.\n\nPehle batao — beginner ho ya already jaante ho? Isse better help mil sakti hai! 😊",
    "Bilkul! Common confusion hai — clearly explain karta hoon.\n\nPehle basics samjho phir advance karenge. Seekhne ke liye patience aur practice dono chahiye.\n\nAur koi doubt? Main yahan hoon! 🙌"
  ]
};

function getResponse(text) {
  var t = text.toLowerCase();
  if (t.includes('python') || t.includes('loop') || t.includes('print')) return rand(responses.python);
  if (t.includes('india') || t.includes('itihaas') || t.includes('history')) return rand(responses.india);
  if (t.includes('motivat') || t.includes('quote') || t.includes('inspire') || t.includes('himmat')) return rand(responses.motivation);
  if (t.includes('ai ') || t.includes('machine learning') || t.includes(' ml') || t.includes('artificial')) return rand(responses.aiml);
  if (t.includes('joke') || t.includes('mazak') || t.includes('funny') || t.includes('hasao')) return rand(responses.joke);
  if (t.includes('html')) return rand(responses.html);
  if (t.includes('css') || t.includes('style')) return rand(responses.css);
  if (t.includes('javascript') || t.includes(' js')) return rand(responses.javascript);
  if (t.includes('coding') || t.includes('programming') || t.includes('code')) return rand(responses.coding);
  if (t.includes('space') || t.includes('planet') || t.includes('star') || t.includes('mars') || t.includes('moon')) return rand(responses.space);
  if (t.includes('science') || t.includes('physics') || t.includes('chemistry') || t.includes('biology')) return rand(responses.science);
  if (t.includes('health') || t.includes('sehat') || t.includes('exercise') || t.includes('diet')) return rand(responses.health);
  return rand(responses.default);
}

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

inputEl.addEventListener("input", function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,130)+"px";
});
inputEl.addEventListener("keydown", function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMsg();}
});

function quickAsk(text){ inputEl.value=text; sendMsg(); }
function esc(str){ return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function scroll(){ msgsEl.scrollTop=msgsEl.scrollHeight; }

function addBubble(text,type){
  var row=document.createElement("div"); row.className="row "+type;
  if(type==="ai"){
    var lbl=document.createElement("div"); lbl.className="row-label";
    var pic='<div class="lbl-pic"><img src="'+PHOTO+'" alt="AI"/></div>';
    lbl.innerHTML=pic+" Rohit ka AI";
    row.appendChild(lbl);
  }
  var b=document.createElement("div"); b.className="bubble";
  b.innerHTML=esc(text);
  row.appendChild(b); msgsEl.appendChild(row); scroll();
}

function addTyping(){
  var row=document.createElement("div"); row.className="row ai"; row.id="typing";
  var lbl=document.createElement("div"); lbl.className="row-label";
  lbl.innerHTML='<div class="lbl-pic"><img src="'+PHOTO+'" alt="AI"/></div> Rohit ka AI';
  var tb=document.createElement("div"); tb.className="typing-bubble";
  tb.innerHTML='<div class="dot-anim"></div><div class="dot-anim"></div><div class="dot-anim"></div>';
  row.appendChild(lbl); row.appendChild(tb);
  msgsEl.appendChild(row); scroll();
}

function removeTyping(){
  var el=document.getElementById("typing");
  if(el) el.remove();
}

function sendMsg(){
  var text=inputEl.value.trim();
  if(!text||btnEl.disabled) return;
  inputEl.value=""; inputEl.style.height="auto";
  btnEl.disabled=true;
  addBubble(text,"user");
  addTyping();
  setTimeout(function(){
    removeTyping();
    addBubble(getResponse(text),"ai");
    btnEl.disabled=false;
    inputEl.focus();
  }, 600+Math.random()*800);
}
</script>
</body>
</html>
